[package]
name = "gitrust-app"
description = "Native desktop application entrypoint for gitRUST."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gitrust"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
gitrust-core.workspace = true
gitrust-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gitrust-git.workspace = true
gitrust-storage.workspace = true
gitrust-providers.workspace = true
rfd = "0.18.0"
notify = "9.0.0"
crossbeam-channel = "0.5.15"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
