name: Bug Report
description: Report a reproducible defect in gitRUST
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in **gitRUST**. Do not include credentials, tokens, private repository URLs, or sensitive logs.
  - type: input
    id: version
    attributes:
      label: gitRUST Version
      description: Output of `gitrust --version` or commit hash
      placeholder: "gitRUST 0.1.0-alpha.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System, Display Session, and GPU
      description: Include OS version, Wayland/X11 (on Linux), GPU model, and `git --version`
      placeholder: "Fedora 45 (Wayland), Intel Iris Xe, git 2.56.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps required to reproduce the issue
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
